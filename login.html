<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RailEase</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <a href="index.html" class="logo">
      🚆 Rail<span>Ease</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="pnr-status.html">PNR Status</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
    </ul>
  </header>

  <main class="container" style="max-width: 450px; margin-top: 3rem;">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 0.5rem; color: var(--primary-color);">Account Login</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Access your saved tickets and profile</p>

      <form onsubmit="event.preventDefault(); alert('Login successful!'); window.location.href='index.html';">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="user@example.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.8rem; margin-top: 1rem;">Login</button>
      </form>

      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.95rem;">
        Don't have an account? <a href="register.html">Register Now</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 RailEase System. Built with pure HTML, CSS & JavaScript.</p>
    </div>
  </footer>

</body>
</html>
